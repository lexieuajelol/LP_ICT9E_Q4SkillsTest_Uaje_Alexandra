<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css " rel="stylesheet">


<style>
 .container{
            height: 300px;
            max-width: 30%;
            background-color: rgb(237, 237, 237);
            text-align: center;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            border-radius: 20px; 
            padding: 10px; 
            margin-top: 100px;
    }

    button {
        width: 102px;
    }
</style>

</head>

<body>
<div class="container">
<h1 class="mt-2">Login</h1>

<form>
<label>Username</label>
<input type="text" class="form-control" id="uname" placeholder="Enter Username">
<label>Password</label>
<input type="password" class="form-control" id="pwd" placeholder="Enter Password">
<input type="checkbox" id="check" onclick="showCheckboxMsg()">
<label class="mt-1">Stay logged in</label>
<div id="show" style="font-size: smaller;"></div>
<div class="row">
    <div class="col">
        <button type="button" class="btn btn-success mt-1" onclick="authenticate()">Login</button>
        </div>
    <div class="col">   
        <button type="button" class="btn btn-primary mt-1">Cancel</button>
        </div>
    </div>
</form>

<script>
let attempts = 3;

function authenticate(){

    var username = document.getElementById('uname').value;
    var password = document.getElementById('pwd').value;
   
if (attempts > 0) {

    if(username === 'janedoe' && password === '12345678'){
        alert("Sucessful Login!");
        window.location.href = 'notebooks.html';
    }else{
        attempts--;
        alert("Invalid Login. You have " + attempts + " attempts left." );
    }
}

    if (attempts === 0) {
        alert("Locked out! (0 attempts left)")
    }

}

function showCheckboxMsg(){
    var checkbox = document.getElementById('check');
    var msg = document.getElementById('show')

    if(checkbox.checked == true){
        msg.innerHTML = "Your session will stay active on this device.";
    }else{
        msg.innerHTML = "";
    }

}
</script>
</body>
</html>
